services:
  # ============================================================================
  # Congressional Disclosures Microservice API
  # ============================================================================
  congress-service:
    build:
      context: ./services/downloader
      dockerfile: Dockerfile
    image: registry.surenther.xyz/congress-downloader:latest
    container_name: congress-downloader-api
    ports:
      - "${PORT:-8511}:8511"
    environment:
      - OUTPUT_BASE_DIR=/data
    volumes:
      # Mount external host directory to store filings outside the Docker container
      # Configure HOST_DATA_DIR in your environment or leave default (./data on host)
      - ${HOST_DATA_DIR:-./data}:/data
      # ----------------------------------------------------------------------
      # OPTIONAL: Override the env files baked into the image.
      # The container works out-of-the-box with the .example defaults. To use
      # your own configuration, create the files on the host and uncomment the
      # mounts below. The files MUST exist as files (not directories), otherwise
      # Docker creates empty directories instead of files.
      #
      #   cd services/downloader
      #   cp .env.house.example .env.house
      #   cp .env.senate.example .env.senate
      #
      # - ./services/downloader/.env.house:/app/.env.house
      # - ./services/downloader/.env.senate:/app/.env.senate
      # ----------------------------------------------------------------------
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8511/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # One-off Job: House Downloader
  # Run via: docker compose run --rm house-job
  # ============================================================================
  house-job:
    build:
      context: ./services/downloader
      dockerfile: Dockerfile
    image: registry.surenther.xyz/congress-downloader:latest
    container_name: congress-house-job
    environment:
      - OUTPUT_BASE_DIR=/data
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      # Optional override (uncomment after creating the file on the host):
      # - ./services/downloader/.env.house:/app/.env.house
    command: ["python", "download_filings.py", "house"]
    profiles: ["cli"]

  # ============================================================================
  # One-off Job: Senate Downloader
  # Run via: docker compose run --rm senate-job
  # ============================================================================
  senate-job:
    build:
      context: ./services/downloader
      dockerfile: Dockerfile
    image: registry.surenther.xyz/congress-downloader:latest
    container_name: congress-senate-job
    environment:
      - OUTPUT_BASE_DIR=/data
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      # Optional override (uncomment after creating the file on the host):
      # - ./services/downloader/.env.senate:/app/.env.senate
    command: ["python", "download_filings.py", "senate"]
    profiles: ["cli"]

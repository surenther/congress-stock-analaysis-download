services:
  # ============================================================================
  # PostgreSQL Database with pgvector support
  # ============================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: congress-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-congress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-congress_db}
    # SECURITY: the database is intentionally NOT published to the host. It is
    # reachable only on the internal Compose network. Uncomment the mapping
    # below ONLY for local debugging, and never on an untrusted network.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-congress} -d ${POSTGRES_DB:-congress_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # Centralized Authentication & Authorization Microservice
  # ============================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-docker.io/congress}/congress-auth:latest
    container_name: congress-auth-service
    ports:
      - "${AUTH_PORT:-8512}:8512"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-congress}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-congress_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8512/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Congressional Disclosures Microservice API
  # ============================================================================
  congress-service:
    build:
      context: ./services/downloader
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-docker.io/congress}/congress-downloader:latest
    container_name: congress-downloader-api
    ports:
      - "${PORT:-8511}:8511"
    environment:
      - OUTPUT_BASE_DIR=/data
      - DATABASE_URL=postgresql://${POSTGRES_USER:-congress}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-congress_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # Reap a stalled PENDING/IN_PROGRESS download job after this many hours so
      # it cannot block future triggers forever (0 disables reaping).
      - DOWNLOADER_STALE_JOB_HOURS=${DOWNLOADER_STALE_JOB_HOURS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount the host storage directory to /data inside the container.
      # Set OUTPUT_BASE_DIR in the .env file next to docker-compose.yml to
      # choose where filings are stored on the host (default: ./data).
      - ${OUTPUT_BASE_DIR:-./data}:/data
      # Mount the env files from the host so edits are picked up on the next
      # container creation. The deploy workflow creates these files from the
      # .example templates if they do not exist yet.
      - ./services/downloader/.env.house:/app/.env.house
      - ./services/downloader/.env.senate:/app/.env.senate
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8511/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # LiteLLM Proxy — multi-provider LLM gateway for the parser service
  # ============================================================================
  litellm-proxy:
    # Pinned to a specific release (not the mutable `main-stable` tag) to avoid
    # silently pulling a compromised or breaking upstream build.
    image: ghcr.io/berriai/litellm:v1.110.2
    container_name: congress-litellm-proxy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
    volumes:
      # Mount the routing config (OpenRouter / Hugging Face / local Ollama).
      - ./services/parser/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    # Allow the proxy to reach a local Ollama/vLLM server running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Document Extraction Microservice (LLM via LiteLLM Proxy)
  # ============================================================================
  parser-service:
    build:
      context: ./services/parser
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-docker.io/congress}/congress-parser:latest
    container_name: congress-parser-service
    ports:
      - "${PARSER_PORT:-8513}:8513"
    environment:
      - OUTPUT_BASE_DIR=/data
      - POSTGRES_USER=${POSTGRES_USER:-congress}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-congress_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-congress}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-congress_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # LiteLLM Proxy connection (multi-provider LLM gateway).
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      - LITELLM_DEFAULT_MODEL=${LITELLM_DEFAULT_MODEL:-openrouter-deepseek-flash}
      - LITELLM_USE_JSON_MODE=${LITELLM_USE_JSON_MODE:-false}
      # Reap a stalled PENDING/IN_PROGRESS parse job after this many hours so it
      # cannot block future triggers forever (0 disables reaping).
      - PARSER_STALE_JOB_HOURS=${PARSER_STALE_JOB_HOURS:-2}
      # Logging verbosity for the parser service (DEBUG shows per-request detail).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount the same host storage directory as congress-service so the parser
      # can read the raw filings written by the downloader and write parsed JSON.
      - ${OUTPUT_BASE_DIR:-./data}:/data
    # Shares the default internal Compose network with the database, the auth
    # service, and the downloader service.
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      congress-service:
        condition: service_started
      litellm-proxy:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8513/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Vectorizer & pgvector Ingestion Microservice
  # ============================================================================
  vectorizer-service:
    build:
      context: ./services/vectorizer
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-docker.io/congress}/congress-vectorizer:latest
    container_name: congress-vectorizer-service
    ports:
      - "${VECTORIZER_PORT:-8514}:8514"
    environment:
      - OUTPUT_BASE_DIR=/data
      - POSTGRES_USER=${POSTGRES_USER:-congress}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-congress_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-congress}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-congress_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # LiteLLM Proxy connection (OpenAI-compatible embeddings gateway).
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openrouter-embed}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      # Reap a stalled PENDING/IN_PROGRESS vectorization job after this many hours
      # so it cannot block future triggers forever (0 disables reaping).
      - VECTORIZER_STALE_JOB_HOURS=${VECTORIZER_STALE_JOB_HOURS:-2}
      # Logging verbosity for the vectorizer service (DEBUG shows per-request detail).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount the same host storage directory as the parser so the vectorizer can
      # read the standardized JSON written to /data/parsed_json/.
      - ${OUTPUT_BASE_DIR:-./data}:/data
    # Shares the default internal Compose network with the database, the auth
    # service, the downloader, the parser, and the LiteLLM proxy.
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      litellm-proxy:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8514/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

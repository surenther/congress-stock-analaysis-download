[pytest]
# ==============================================================================
# Pytest configuration for the automated API test suite
# ==============================================================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . tests

# Run async tests without an explicit marker on every function.
asyncio_mode = auto

# Fail fast on unhandled async warnings and keep output readable.
addopts =
    -ra
    --strict-markers
    --timeout=300

# Custom markers. The default run excludes `llm` and `slow`; opt in with
# `pytest -m llm` (requires RUN_LLM_TESTS=true and real provider keys).
markers =
    contract: Fast, no-LLM tests validating auth, RBAC, validation, schemas, and errors.
    integration: Tests that exercise real job lifecycles against the running stack.
    llm: Tests that spend LLM/embedding credits (skipped unless RUN_LLM_TESTS=true).
    slow: Long-running tests (job polling, large scans).

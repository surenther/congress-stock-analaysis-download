# ==============================================================================
# LiteLLM Proxy configuration for the Congressional Disclosure Parser
# ==============================================================================
# This file is mounted into the `litellm-proxy` container (see docker-compose.yml)
# and tells the proxy how to route a requested `model` name to a concrete backend.
#
# The parser service never talks to a provider directly. It always POSTs to the
# proxy's OpenAI-compatible `/chat/completions` endpoint and selects a backend by
# passing one of the `model_name` aliases defined below.
#
# Three backends are configured:
#   1. OpenRouter  — cloud models (cheap DeepSeek Flash default; Gemini 3.8 Flash costly).
#   2. Hugging Face — open-weights hosted models (Qwen 2.5 Instruct via the
#                     HF Inference API).
#   3. Local LLM   — self-hosted models on GPU via Ollama (or vLLM) exposed at
#                     OLLAMA_API_BASE.
#
# Secrets are read from the container environment (mapped in docker-compose.yml
# from the root .env file) using LiteLLM's `os.environ/VAR` syntax so that no
# credentials are ever committed to this file.
# ==============================================================================

model_list:
  # --------------------------------------------------------------------------
  # 1. OpenRouter — default cloud provider
  # --------------------------------------------------------------------------
  # NOTE: OpenRouter model IDs differ from the Google AI Studio names. Verify
  # IDs at https://openrouter.ai/models before changing them; an unknown ID
  # makes OpenRouter return HTTP 400 "not a valid model ID".
  #
  # Cheap, high-throughput model — the DEFAULT for bulk runs.
  - model_name: openrouter-deepseek-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # Costly, higher-capability model — select per job for hard documents.
  - model_name: openrouter-gemini-flash
    litellm_params:
      model: openrouter/google/gemini-3.8-flash:batch
      api_key: os.environ/OPENROUTER_API_KEY
      # Optional: pin a specific upstream provider / routing preference.
      # extra_body:
      #   provider:
      #     order: ["Google"]

  # --------------------------------------------------------------------------
  # 2. Hugging Face — open-weights hosted models via the Inference API
  # --------------------------------------------------------------------------
  - model_name: hf-qwen
    litellm_params:
      model: huggingface/Qwen/Qwen2.5-7B-Instruct
      api_key: os.environ/HUGGINGFACE_API_KEY

  # --------------------------------------------------------------------------
  # 3. Local LLM — self-hosted on GPU via Ollama (or vLLM)
  # --------------------------------------------------------------------------
  # `ollama/` routes to a local Ollama server. Point OLLAMA_API_BASE at the
  # host/GPU box (e.g. http://host.docker.internal:11434). For vLLM, swap the
  # prefix to `openai/` and set api_base to the vLLM OpenAI-compatible endpoint.
  - model_name: local-llm
    litellm_params:
      model: ollama/qwen2.5:7b-instruct
      api_base: os.environ/OLLAMA_API_BASE

  # --------------------------------------------------------------------------
  # 4. Embeddings — semantic vectors for the vectorizer service
  # --------------------------------------------------------------------------
  # The vectorizer service POSTs text chunks to the proxy's OpenAI-compatible
  # `/v1/embeddings` endpoint and selects a backend by passing one of the
  # `model_name` aliases below.
  #
  # IMPORTANT — vector dimensions: the vectorizer's `disclosure_embeddings.embedding`
  # column defaults to `vector(1536)`. Models with a different dimension (e.g. the
  # free Hugging Face model at 384d, or Ollama at 768d) require setting
  # EMBEDDING_DIM to the matching value and recreating the table (see the
  # Vectorizer Service README).
  #
  # DEFAULT embedding model (1536 dimensions). Routed through OpenRouter, reusing
  # the same OPENROUTER_API_KEY as the chat models — no extra provider key needed.
  - model_name: openrouter-embed
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY

  # OpenAI-routed embeddings (1536 dimensions). Routed directly to OpenAI; set
  # OPENAI_API_KEY in .env. Select with "embedding_model": "text-embedding-3-small".
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Free Hugging Face Inference API embeddings (BAAI/bge-small-en-v1.5, 384d).
  # Uses the free HUGGINGFACE_API_KEY tier. NOTE: 384 dimensions — set
  # EMBEDDING_DIM=384 and recreate the disclosure_embeddings table before
  # selecting this alias. Select with "embedding_model": "hf-embed".
  - model_name: hf-embed
    litellm_params:
      model: huggingface/BAAI/bge-small-en-v1.5
      api_key: os.environ/HUGGINGFACE_API_KEY

  # Local embeddings via Ollama (e.g. nomic-embed-text, 768d). If you switch to
  # this alias, set EMBEDDING_DIM=768 and recreate the table.
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE

# ------------------------------------------------------------------------------
# General settings
# ------------------------------------------------------------------------------
general_settings:
  # The parser service authenticates to the proxy with this master key
  # (sent as `Authorization: Bearer <LITELLM_MASTER_KEY>`).
  master_key: os.environ/LITELLM_MASTER_KEY

# ------------------------------------------------------------------------------
# LiteLLM runtime settings
# ------------------------------------------------------------------------------
litellm_settings:
  # Silently drop parameters a given backend does not support (e.g. some local
  # models reject `response_format`), so a single request shape works everywhere.
  drop_params: true
  # Keep request/response logging concise.
  set_verbose: false

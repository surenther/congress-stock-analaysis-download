# ==============================================================================
# Gitea Actions Workflow: Build & Push Docker Images
# ==============================================================================
# On every push to main (or a v* tag) this workflow builds the downloader, auth,
# parser, vectorizer, admin, RAG, and web Docker images and pushes them to a
# container registry, each tagged with `latest` and the short commit SHA (or the
# tag name).
#
# It does NOT deploy. There is no SSH step and no `docker compose` invocation.
# Deployment is performed manually on the server (see the "Image Build & Manual
# Deployment" section of README.md) by pulling the freshly pushed images.
#
# ------------------------------------------------------------------------------
# Incremental builds (only rebuild what changed)
# ------------------------------------------------------------------------------
# A `changes` job diffs the pushed commit range and decides, per service, whether
# its image needs rebuilding. Each build step is then gated with an `if:` so that
# only the affected images are built and pushed.
#
# A service is rebuilt when any file under its `services/<name>/` directory
# changed. In addition, the following always trigger a full rebuild of every
# image (fail-safe):
#   * a tag push (v*)
#   * the first push to a branch, or a force push (no usable base commit)
#   * a change to this workflow file itself
#
# ------------------------------------------------------------------------------
# Registry configuration
# ------------------------------------------------------------------------------
# The registry is NOT hardcoded. Set a repository (or organization) variable
# named IMAGE_REGISTRY in Gitea:
#
#   Gitea → Repository → Settings → Actions → Variables → Add variable
#     Name:  IMAGE_REGISTRY
#     Value: <registry host and optional namespace>
#
# Examples:
#   IMAGE_REGISTRY=registry.example.com          -> registry.example.com/congress-auth:latest
#   IMAGE_REGISTRY=docker.io/myuser              -> docker.io/myuser/congress-auth:latest
#   IMAGE_REGISTRY=ghcr.io/myorg                 -> ghcr.io/myorg/congress-auth:latest
#
# If IMAGE_REGISTRY is unset, it falls back to `docker.io/congress` (Docker Hub).
#
# NOTE: The runner must already be authenticated to the chosen registry (e.g. via
# a pre-seeded ~/.docker/config.json or a `docker login` on the runner), since
# this workflow intentionally contains no registry-login step.
# ==============================================================================

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  IMAGE_NAME: congress-downloader
  AUTH_IMAGE_NAME: congress-auth
  PARSER_IMAGE_NAME: congress-parser
  VECTORIZER_IMAGE_NAME: congress-vectorizer
  ADMIN_IMAGE_NAME: congress-admin
  RAG_IMAGE_NAME: congress-rag
  WEB_IMAGE_NAME: congress-web

jobs:
  # ----------------------------------------------------------------------------
  # Detect which service directories changed in this push. Exposes one boolean
  # output per service that the build job consumes via `if:` conditions.
  # ----------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      downloader: ${{ steps.filter.outputs.downloader }}
      auth: ${{ steps.filter.outputs.auth }}
      parser: ${{ steps.filter.outputs.parser }}
      vectorizer: ${{ steps.filter.outputs.vectorizer }}
      admin: ${{ steps.filter.outputs.admin }}
      rag: ${{ steps.filter.outputs.rag }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        # Pinned to a full commit SHA (v4.2.2) to prevent supply-chain attacks
        # via a silently repointed tag.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history is required so we can diff the pushed commit range.
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        run: |
          set -euo pipefail

          # Decide the base commit to diff against. Tags and first/force pushes
          # have no usable base, so they force a full rebuild.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            CHANGED="ALL"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED="ALL"
            else
              CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null || echo ALL)"
            fi
          fi

          # Returns success (0) when the given service directory needs a rebuild.
          changed() {
            local dir="$1"
            if [ "$CHANGED" = "ALL" ]; then return 0; fi
            if printf '%s\n' "$CHANGED" | grep -q "^${dir}/"; then return 0; fi
            # A change to the workflow itself always rebuilds everything.
            if printf '%s\n' "$CHANGED" | grep -q "^\.gitea/workflows/"; then return 0; fi
            return 1
          }

          {
            echo "downloader=$(changed services/downloader && echo true || echo false)"
            echo "auth=$(changed services/auth-service && echo true || echo false)"
            echo "parser=$(changed services/parser && echo true || echo false)"
            echo "vectorizer=$(changed services/vectorizer && echo true || echo false)"
            echo "admin=$(changed services/admin-service && echo true || echo false)"
            echo "rag=$(changed services/rag && echo true || echo false)"
            echo "web=$(changed services/web && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a full commit SHA (v4.2.2) to prevent supply-chain attacks
        # via a silently repointed tag.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve image registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY:-docker.io/congress}" >> "$GITHUB_ENV"

      - name: Set image tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        # Pinned to a full commit SHA (v3.10.0).
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build and Push Downloader
        if: needs.changes.outputs.downloader == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/downloader
          file: ./services/downloader/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push Auth Service
        if: needs.changes.outputs.auth == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.AUTH_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.AUTH_IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push Parser Service
        if: needs.changes.outputs.parser == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/parser
          file: ./services/parser/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.PARSER_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.PARSER_IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push Vectorizer Service
        if: needs.changes.outputs.vectorizer == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/vectorizer
          file: ./services/vectorizer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.VECTORIZER_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.VECTORIZER_IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push Admin Service
        if: needs.changes.outputs.admin == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/admin-service
          file: ./services/admin-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push RAG Service
        if: needs.changes.outputs.rag == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/rag
          file: ./services/rag/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.RAG_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.RAG_IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push Web App
        if: needs.changes.outputs.web == 'true'
        # Pinned to a full commit SHA (v5.4.0).
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./services/web
          file: ./services/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ env.TAG }}

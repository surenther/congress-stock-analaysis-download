# ==============================================================================
# Gitea Actions Workflow: Build, Push & Deploy
# ==============================================================================
# On every push to main (or a v* tag):
#   1. Builds the downloader Docker image
#   2. Pushes it to the container registry (registry.surenther.xyz)
#   3. SSHes into the server and runs `docker compose pull && docker compose up -d`
#
# The .env.house / .env.senate files are NOT stored in Gitea. They are created
# manually on the server inside the deploy directory (DEPLOY_PATH).
# ==============================================================================

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: registry.surenther.xyz
  IMAGE_NAME: congress-downloader
  AUTH_IMAGE_NAME: congress-auth

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          MISSING=""
          [ -z "$DEPLOY_HOST" ] && MISSING="$MISSING DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && MISSING="$MISSING DEPLOY_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && MISSING="$MISSING DEPLOY_SSH_KEY"
          [ -z "$DEPLOY_PATH" ] && MISSING="$MISSING DEPLOY_PATH"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING. Add them in Gitea > Repository > Settings > Actions > Secrets."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Build and Push Downloader
        uses: docker/build-push-action@v5
        with:
          context: ./services/downloader
          file: ./services/downloader/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE_NAME }}:${{ env.TAG }}

      - name: Deploy to server
        run: |
          # 1. Fallback port to 22 if DEPLOY_PORT secret is empty
          PORT="${{ secrets.DEPLOY_PORT }}"
          PORT="${PORT:-22}"

          # 2. Setup SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 3. Write the private key directly (preserves newlines, no added whitespace)
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 4. Scan remote host key
          ssh-keyscan -p "$PORT" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 5. On the server: create the deploy directory and remove any leftover
          #    DIRECTORIES that Docker may have made for missing env files
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p ${{ secrets.DEPLOY_PATH }}/services/downloader && \
             [ -d ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.house ] && rm -rf ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.house; \
             [ -d ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.senate ] && rm -rf ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.senate; \
             true"

          # 6. Deploy docker-compose.yml (always updated from the repo)
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=no \
            docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml"

          # 7. Create sample env files on the server IF they don't exist yet
          #    (your later edits are preserved on subsequent deploys)
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "[ -f ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.house ] || cat > ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.house" \
            < <(sed 's|^OUTPUT_BASE_DIR=.*|OUTPUT_BASE_DIR=/data|' services/downloader/.env.house.example)

          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "[ -f ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.senate ] || cat > ${{ secrets.DEPLOY_PATH }}/services/downloader/.env.senate" \
            < <(sed 's|^OUTPUT_BASE_DIR=.*|OUTPUT_BASE_DIR=/data|' services/downloader/.env.senate.example)

          # 8. Create a sample .env next to docker-compose.yml (for the
          #    OUTPUT_BASE_DIR host-storage variable) IF it doesn't exist yet
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "[ -f ${{ secrets.DEPLOY_PATH }}/.env ] || cat > ${{ secrets.DEPLOY_PATH }}/.env" \
            < .env.example

          # 9. Pull the images and start the stack
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull && docker compose up -d"
